name: 줍쥐 TOP 100 갱신

on:
  schedule:
    - cron: "7 21 * * *"   # 매일 한국시간 오전 6:07 - 쿠팡 API로 상품 갱신
  workflow_dispatch:        # 수동 실행 버튼 (상품 갱신 포함)
  push:                     # 코드·디자인·데일리픽 문구가 바뀌면 페이지만 다시 만들어 배포
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: joopjwi-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 쿠팡 API로 상품 갱신
        if: github.event_name != 'push'
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID }}
        run: python update.py
      - name: 데이터 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "joopjwi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "줍쥐 TOP 100 갱신 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push
      - name: 상품·픽 페이지 생성
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
