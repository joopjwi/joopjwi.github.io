name: 줍쥐 TOP 100 갱신

on:
  schedule:
    - cron: "37 20 * * *"  # 매일 한국시간 오전 5:37 시작 (GitHub 예약 지연을 감안해 늦어도 6시대 초반 완료)
  workflow_dispatch:        # 수동 실행 버튼 (상품 갱신 포함)
    inputs:
      build_only:
        description: "상품 갱신 없이 페이지만 다시 배포"
        type: boolean
        default: false
  push:                     # 코드·디자인·데일리픽 문구가 바뀌면 페이지만 다시 만들어 배포
    branches: [main]

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: joopjwi-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 쿠팡 API로 상품 갱신
        id: update
        if: github.event_name != 'push' && inputs.build_only != true
        continue-on-error: true   # 실패해도 오류 상태를 저장·배포한 뒤 마지막에 실패 처리
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID }}
        run: python update.py
      - name: 데이터 저장
        if: github.event_name != 'push' && inputs.build_only != true
        run: |
          git config user.name "joopjwi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data site/api
          git diff --cached --quiet || git commit -m "줍쥐 TOP 100 갱신 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push
      - name: 릴스용 상품 사진 저장 (media 브랜치, 매일 덮어씀)
        if: github.event_name != 'push' && inputs.build_only != true && steps.update.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/media/img
          python - <<'EOF'
          import json, urllib.request, concurrent.futures as cf, re
          d = json.load(open("site/data/products.json"))
          def get(p):
              url = p["image"]
              # 쿠팡 썸네일 경로에 크기가 들어 있으면 큰 사이즈로 요청
              big = re.sub(r"/thumbnails/remote/\d+x\d+ex/", "/thumbnails/remote/1000x1000ex/", url)
              for u in (big, url):
                  try:
                      req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
                      data = urllib.request.urlopen(req, timeout=15).read()
                      if len(data) > 2000:
                          open(f"/tmp/media/img/{p['id']}.jpg", "wb").write(data); return 1
                  except Exception:
                      pass
              return 0
          with cf.ThreadPoolExecutor(12) as ex:
              n = sum(ex.map(get, d["products"]))
          print("이미지 저장:", n)
          EOF
          cp site/data/products.json site/data/top5.json /tmp/media/
          cd /tmp/media && git init -q -b media && git add -A
          git -c user.name=joopjwi-bot -c user.email=actions@users.noreply.github.com commit -qm "media $(TZ=Asia/Seoul date +%F)"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" media
      - name: 상품·픽 페이지 생성 (+ 릴스 영상 포함)
        run: |
          python build.py
          mkdir -p site/reels
          git clone -q --depth 1 -b reels-out https://github.com/${{ github.repository }}.git /tmp/ro 2>/dev/null && cp /tmp/ro/*.mp4 /tmp/ro/*.jpg /tmp/ro/*.json site/reels/ 2>/dev/null || true
          ls site/reels
          mkdir -p site/studio/done
          git clone -q --depth 1 -b studio-done https://github.com/${{ github.repository }}.git /tmp/sd 2>/dev/null && cp /tmp/sd/*.mp4 /tmp/sd/*.jpg /tmp/sd/done.json site/studio/done/ 2>/dev/null || true
          ls site/studio/done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
      - name: 배포 후 외부 접속 확인 (HTTP 200·Content-Type·JSON·날짜)
        id: verify
        continue-on-error: true
        run: |
          python - <<'EOF'
          import json, time, urllib.request
          base = "https://joopjwi.github.io"
          want = json.load(open("site/api/top5.json"))["dataDate"]
          checks = [("/api/top5.json", "application/json"), ("/api/top100.json", "application/json"),
                    ("/api/status.json", "application/json"), ("/api/top5.html", "text/html"),
                    ("/robots.txt", "text/plain")]
          ok_all = True
          for path, ctype in checks:
              res = "fail"
              for attempt in range(10):  # Pages 반영 지연 대비 최대 약 5분 재시도
                  try:
                      req = urllib.request.Request(f"{base}{path}?v={int(time.time())}",
                                                   headers={"User-Agent": "Mozilla/5.0 (compatible; ChatGPT-User/1.0)"})
                      r = urllib.request.urlopen(req, timeout=20)
                      body = r.read().decode("utf-8")
                      ct = r.headers.get("Content-Type", "")
                      fresh = True
                      if path.endswith(".json"):
                          d = json.loads(body)
                          fresh = d.get("dataDate") == want
                      if r.status == 200 and ctype in ct and fresh:
                          res = f"OK 200 {ct}"
                          break
                      res = f"재시도 status={r.status} ct={ct} fresh={fresh}"
                  except Exception as e:
                      res = f"오류 {e}"
                  time.sleep(30)
              print(f"{path}: {res}")
              ok_all &= res.startswith("OK")
          print("외부 접속 확인:", "모두 정상" if ok_all else "문제 있음")
          raise SystemExit(0 if ok_all else 1)
          EOF
      - name: 갱신 실패 알림 (GitHub가 실패 메일을 보냄)
        if: steps.update.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: |
          echo "쿠팡 데이터 갱신 실패 - site/api/status.json 확인"
          cat site/api/status.json || true
          exit 1

  deals:
    # 특가 단톡용 가격 비교. TOP 100 API 호출과 겹치지 않게 65분 이상 띄운 뒤 실행
    needs: update
    if: github.event_name != 'push' && inputs.build_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 직전 API 호출 후 66분 대기
        run: |
          python - <<'PY'
          import json, time
          from datetime import datetime, timezone
          s = json.load(open("site/data/api_state.json"))
          last = datetime.fromisoformat(s["lastApiRun"])
          wait = 66 * 60 - (datetime.now(timezone.utc) - last).total_seconds()
          print(f"대기 {max(0, int(wait))}초")
          if wait > 0:
              time.sleep(wait)
          PY
      - name: 특가 찾기
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID }}
        run: python deals.py
      - name: 저장
        run: |
          git config user.name "joopjwi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/deals site/data/api_state.json site/deals
          git diff --cached --quiet || git commit -m "줍쥐 특가 단톡 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push
      - name: 단톡 메시지 페이지 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml -R ${{ github.repository }} -f build_only=true
